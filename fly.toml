# fly.toml app configuration file generated for backend-ft on 2026-09-06T09:03:53Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backend-ft'
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
